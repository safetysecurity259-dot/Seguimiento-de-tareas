<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --ink:#1C2321; --paper:#F7F3EC; --panel:#242B29; --teal:#2F6F62;
    --amber:#D98E3B; --rust:#B5533C; --slate:#7C8580; --line:#E3DCCC;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--paper); }
  h1,.h { font-family:'Space Grotesk',sans-serif; }
  .layout { display:flex; min-height:100vh; }
  .sidebar { width:220px; background:var(--ink); color:var(--paper); padding:24px 16px; flex-shrink:0; }
  .sidebar .logo { font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; margin-bottom:28px; }
  .navbtn { width:100%; text-align:left; background:transparent; color:var(--paper); border:none; border-radius:6px;
    padding:8px 10px; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .navbtn.active, .navbtn:hover { background:var(--panel); }
  .hr { height:1px; background:#3A423F; margin:18px 0; }
  .hint { margin-top:24px; font-size:12px; color:#8A9490; line-height:1.5; }
  .main { flex:1; padding:28px 32px; overflow-y:auto; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .btn { border-radius:6px; padding:8px 14px; font-size:14px; font-weight:500; cursor:pointer; border:none;
    display:inline-flex; align-items:center; gap:6px; }
  .btn-primary { background:var(--teal); color:#fff; }
  .btn-ghost { background:var(--paper); border:1px solid var(--line); }
  .filters { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  input, select, textarea { border:1px solid var(--line); background:#fff; border-radius:6px; padding:8px 10px;
    font-size:14px; color:var(--ink); font-family:inherit; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--teal); outline-offset:1px; }
  .search-wrap { position:relative; flex:1 1 220px; }
  .search-wrap input { width:100%; padding-left:32px; }
  .task-card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px;
    display:flex; align-items:center; gap:14px; margin-bottom:8px; }
  .dot { width:8px; height:8px; border-radius:8px; flex-shrink:0; }
  .badge { font-size:12.5px; padding:3px 10px; border-radius:20px; font-weight:600; flex-shrink:0; white-space:nowrap; }
  .icon-btn { background:none; border:none; cursor:pointer; padding:4px; }
  .empty { text-align:center; padding:60px 0; color:var(--slate); }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  .stat-card, .chart-card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; }
  .stat-card .num { font-size:28px; font-weight:700; }
  .modal-bg { position:fixed; inset:0; background:rgba(28,35,33,.45); display:flex; align-items:center;
    justify-content:center; z-index:50; }
  .modal { background:#fff; border-radius:10px; padding:24px; width:440px; max-height:88vh; overflow-y:auto; }
  .field { margin-bottom:12px; }
  .field label { font-size:12.5px; color:var(--slate); margin-bottom:4px; font-weight:500; display:block; }
  .field input, .field select, .field textarea { width:100%; }
  .field-row { display:flex; gap:10px; }
  .field-row .field { flex:1; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="logo">Tablero de equipo</div>
    <button class="navbtn active" id="nav-tasks" onclick="setView('tasks')">Tareas</button>
    <button class="navbtn" id="nav-dashboard" onclick="setView('dashboard')">Dashboard</button>
    <div class="hr"></div>
    <button class="navbtn" onclick="exportCsv()">Exportar CSV</button>
    <button class="navbtn" onclick="loadTasks()">Actualizar datos</button>
    <div class="hint" id="hint">Cargando tareas…</div>
  </div>
  <div class="main">
    <div id="view-tasks">
      <div class="row">
        <h1 class="h" style="font-size:24px;font-weight:700;margin:0;">Tareas</h1>
        <button class="btn btn-primary" onclick="openForm()"><span>+</span> Nueva tarea</button>
      </div>
      <div class="filters">
        <div class="search-wrap">
          <input id="searchInput" placeholder="Buscar tarea, categoría o responsable" oninput="renderTasks()">
        </div>
        <select id="filterStatus" onchange="renderTasks()" style="width:160px;">
          <option>Todas</option>
          <option>Pendiente</option><option>En progreso</option><option>Bloqueada</option><option>Cerrada</option>
        </select>
        <select id="filterResp" onchange="renderTasks()" style="width:180px;"><option>Todos</option></select>
      </div>
      <div id="taskList"></div>
    </div>
    <div id="view-dashboard" style="display:none;">
      <h1 class="h" style="font-size:24px;font-weight:700;margin-bottom:20px;">Dashboard</h1>
      <div class="stat-grid" id="statGrid"></div>
      <div class="chart-card" style="margin-bottom:20px;">
        <div class="h" style="font-weight:600;margin-bottom:12px;">Estado de las tareas</div>
        <canvas id="statusChart" height="220"></canvas>
      </div>
      <div class="chart-card">
        <div class="h" style="font-weight:600;margin-bottom:12px;">Cierres de tareas por responsable</div>
        <canvas id="closuresChart" height="220"></canvas>
      </div>
    </div>
  </div>
</div>

<div id="formModal"></div>

<script>
/* =========================================================
   1) PEGA AQUÍ LA URL DE TU APPS SCRIPT (termina en /exec)
   ========================================================= */
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbwLYxlXJghsnF7lAYJIjD1E3ISFhLVRQOPhu3ddd1qjdyMX1lgC_sVJQJsrvIqk8ZKA/exec";

const STATUSES = ["Pendiente", "En progreso", "Bloqueada", "Cerrada"];
const RESPONSIBLES = ["Gabriel de la Piedra", "Francisco Jofre", "Carolina Avila", "Felipe Camus"];
const CATEGORIES = ["Safety", "Security", "Calidad"];
const STATUS_COLOR = { "Pendiente": "#7C8580", "En progreso": "#D98E3B", "Bloqueada": "#B5533C", "Cerrada": "#2F6F62" };
let tasks = [];
let currentView = "tasks";
let statusChart, closuresChart;

function uid() { return Math.random().toString(36).slice(2, 10); }
function today() { return new Date().toISOString().slice(0, 10); }

function loadTasks(attempt) {
  attempt = attempt || 1;
  const maxAttempts = 3;
  document.getElementById("hint").textContent = attempt === 1
    ? "Cargando tareas… (puede tardar unos segundos)"
    : `Cargando tareas… (reintento ${attempt}/${maxAttempts})`;
  return new Promise((resolve) => {
    const cbName = "tbCallback_" + Date.now() + "_" + attempt;
    const script = document.createElement("script");
    const timeout = setTimeout(() => {
      cleanup();
      if (attempt < maxAttempts) {
        loadTasks(attempt + 1).then(resolve);
      } else {
        document.getElementById("hint").textContent = "No se pudo conectar con Sheets. Revisa SHEETS_API_URL.";
        resolve();
      }
    }, 40000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function (data) {
      tasks = data.tasks || [];
      document.getElementById("hint").textContent = tasks.length + " tareas registradas.";
      populateResponsibleFilter();
      renderTasks();
      renderDashboard();
      cleanup();
      resolve();
    };
    script.onerror = function () {
      cleanup();
      if (attempt < maxAttempts) {
        loadTasks(attempt + 1).then(resolve);
      } else {
        document.getElementById("hint").textContent = "No se pudo conectar con Sheets. Revisa SHEETS_API_URL.";
        resolve();
      }
    };
    script.src = SHEETS_API_URL + (SHEETS_API_URL.includes("?") ? "&" : "?") + "callback=" + cbName;
    document.body.appendChild(script);
  });
}

async function saveTaskRemote(task) {
  try {
    await fetch(SHEETS_API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "save", task }) });
  } catch (e) { /* no-cors: no se puede leer la respuesta, pero la escritura sí llega al servidor */ }
}
async function deleteTaskRemote(id) {
  try {
    await fetch(SHEETS_API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", id }) });
  } catch (e) { /* idem */ }
}

function setView(v) {
  currentView = v;
  document.getElementById("view-tasks").style.display = v === "tasks" ? "block" : "none";
  document.getElementById("view-dashboard").style.display = v === "dashboard" ? "block" : "none";
  document.getElementById("nav-tasks").classList.toggle("active", v === "tasks");
  document.getElementById("nav-dashboard").classList.toggle("active", v === "dashboard");
  if (v === "dashboard") renderDashboard();
}

function populateResponsibleFilter() {
  const sel = document.getElementById("filterResp");
  const current = sel.value;
  sel.innerHTML = '<option>Todos</option>' + RESPONSIBLES.map(n => `<option>${escapeHtml(n)}</option>`).join("");
  sel.value = RESPONSIBLES.includes(current) ? current : "Todos";
}

function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderTasks() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const fStatus = document.getElementById("filterStatus").value;
  const fResp = document.getElementById("filterResp").value;
  const list = tasks.filter(t => {
    if (fStatus !== "Todas" && t.status !== fStatus) return false;
    if (fResp !== "Todos" && t.responsible !== fResp) return false;
    if (search && !((t.title||"")+(t.category||"")+(t.responsible||"")).toLowerCase().includes(search)) return false;
    return true;
  });
  const el = document.getElementById("taskList");
  if (list.length === 0) {
    el.innerHTML = `<div class="empty">${tasks.length === 0 ? 'Aún no hay tareas. Crea la primera con "Nueva tarea".' : 'Ninguna tarea coincide con el filtro.'}</div>`;
    return;
  }
  el.innerHTML = list.map(t => `
    <div class="task-card">
      <div class="dot" style="background:${STATUS_COLOR[t.status]||'#999'}"></div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:15px;">${escapeHtml(t.title) || "(sin título)"}</div>
        ${t.description ? `<div style="font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(t.description)}</div>` : ""}
        <div style="font-size:12.5px;color:var(--slate);margin-top:2px;">
          ${escapeHtml(t.category) || "Sin categoría"} · ${escapeHtml(t.responsible) || "Sin asignar"} · ${t.startDate || ""}${t.endDate ? " → " + t.endDate : ""}
        </div>
      </div>
      <div class="badge" style="background:${(STATUS_COLOR[t.status]||'#999')}22;color:${STATUS_COLOR[t.status]||'#999'}">${escapeHtml(t.status)}</div>
      <button class="icon-btn" title="Editar" onclick='openForm(${JSON.stringify(t).replace(/'/g,"&#39;")})'>✎</button>
      <button class="icon-btn" title="Eliminar" onclick="removeTask('${t.id}')" style="color:var(--rust);">🗑</button>
    </div>
  `).join("");
}

function renderDashboard() {
  const statGrid = document.getElementById("statGrid");
  statGrid.innerHTML = STATUSES.map(s => `
    <div class="stat-card">
      <div style="font-size:12.5px;color:var(--slate);font-weight:500;">${s}</div>
      <div class="h num" style="color:${STATUS_COLOR[s]}">${tasks.filter(t => t.status === s).length}</div>
    </div>`).join("");

  const statusData = STATUSES.map(s => tasks.filter(t => t.status === s).length);
  if (statusChart) statusChart.destroy();
  statusChart = new Chart(document.getElementById("statusChart"), {
    type: "pie",
    data: { labels: STATUSES, datasets: [{ data: statusData, backgroundColor: STATUSES.map(s => STATUS_COLOR[s]) }] },
    options: { plugins: { legend: { position: "bottom" } } }
  });

  const map = {};
  tasks.filter(t => t.status === "Cerrada").forEach(t => {
    const key = t.responsible || "Sin asignar";
    map[key] = (map[key] || 0) + 1;
  });
  const names = Object.keys(map).sort((a,b) => map[b]-map[a]);
  if (closuresChart) closuresChart.destroy();
  closuresChart = new Chart(document.getElementById("closuresChart"), {
    type: "bar",
    data: { labels: names, datasets: [{ label: "Tareas cerradas", data: names.map(n => map[n]), backgroundColor: "#2F6F62" }] },
    options: { indexAxis: "y", plugins: { legend: { display: false } }, scales: { x: { ticks: { precision: 0 } } } }
  });
}

function openForm(task) {
  const t = task || { id: uid(), title: "", description: "", category: "", responsible: "", startDate: today(), endDate: "", status: "Pendiente", createdAt: today(), closedAt: "" };
  document.getElementById("formModal").innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeForm()">
      <div class="modal">
        <div class="row" style="margin-bottom:16px;">
          <div class="h" style="font-weight:700;font-size:18px;">${t.title ? "Editar tarea" : "Nueva tarea"}</div>
          <button class="icon-btn" onclick="closeForm()">✕</button>
        </div>
        <div class="field"><label>Título</label><input id="f-title" value="${escapeHtml(t.title)}"></div>
        <div class="field"><label>Descripción</label><textarea id="f-description" rows="3" placeholder="Detalla la acción a realizar">${escapeHtml(t.description)}</textarea></div>
        <div class="field-row">
          <div class="field"><label>Categoría</label>
            <select id="f-category">
              <option value="">Selecciona…</option>
              ${CATEGORIES.map(c => `<option ${c===t.category?'selected':''}>${c}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label>Responsable</label>
            <select id="f-responsible">
              <option value="">Selecciona…</option>
              ${RESPONSIBLES.map(r => `<option ${r===t.responsible?'selected':''}>${escapeHtml(r)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Fecha inicio</label><input type="date" id="f-startDate" value="${t.startDate||''}"></div>
          <div class="field"><label>Fecha cierre</label><input type="date" id="f-endDate" value="${t.endDate||''}"></div>
        </div>
        <div class="field"><label>Estado</label>
          <select id="f-status">${STATUSES.map(s => `<option ${s===t.status?'selected':''}>${s}</option>`).join("")}</select>
        </div>
        <div style="display:flex;gap:8px;margin-top:18px;">
          <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick='submitForm(${JSON.stringify(t).replace(/'/g,"&#39;")})'>Guardar</button>
          <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeForm()">Cancelar</button>
        </div>
      </div>
    </div>`;
}
function closeForm() { document.getElementById("formModal").innerHTML = ""; }

async function submitForm(original) {
  const status = document.getElementById("f-status").value;
  const wasClosedBefore = original.status === "Cerrada";
  const task = {
    ...original,
    title: document.getElementById("f-title").value,
    description: document.getElementById("f-description").value,
    category: document.getElementById("f-category").value,
    responsible: document.getElementById("f-responsible").value,
    startDate: document.getElementById("f-startDate").value,
    endDate: document.getElementById("f-endDate").value,
    status,
    closedAt: status === "Cerrada" ? (original.closedAt || today()) : "",
  };
  closeForm();
  const idx = tasks.findIndex(x => x.id === task.id);
  if (idx >= 0) tasks[idx] = task; else tasks.push(task);
  renderTasks();
  await saveTaskRemote(task);
  loadTasks();
}

async function removeTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  renderTasks();
  await deleteTaskRemote(id);
}

function exportCsv() {
  const headers = ["Titulo","Descripcion","Categoria","Responsable","Fecha inicio","Fecha cierre","Estado","Creado","Cerrado"];
  const rows = tasks.map(t => [t.title,t.description,t.category,t.responsible,t.startDate,t.endDate,t.status,t.createdAt,t.closedAt]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "tareas_equipo.csv"; a.click();
  URL.revokeObjectURL(url);
}

loadTasks();
</script>
</body>
</html>
